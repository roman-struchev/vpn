name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  server-ci:
    name: Backend Server (Java 25 / Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Protobuf and build Server
        run: ./gradlew :server:compileJava :server:compileTestJava

      - name: Run Server Unit & Integration Tests
        run: ./gradlew :server:test

  agent-ci:
    name: Node Agent (TypeScript / Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'agent/package-lock.json'

      - name: Install Agent dependencies
        working-directory: agent
        run: npm ci

      - name: Typecheck and compile Agent
        working-directory: agent
        run: npm run build

      - name: Run Agent Unit Tests
        working-directory: agent
        run: npm test

  docker-validate:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose syntax
        run: docker compose config
