name: Build & Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build (Server & Agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Server (no tests)
        run: ./gradlew :server:compileJava

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'agent/package-lock.json'

      - name: Build Agent
        working-directory: agent
        run: |
          npm ci
          npm run build

  android:
    name: Build (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle 9.1.0 + AGP 9.0.1 (see android/build.gradle and
      # android/gradle/wrapper) both run under a JDK 25 daemon — matches every
      # other job in this workflow now.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: 'android/**/*.gradle*'

      # android-actions/setup-android@v3 started failing here ("Failed to find
      # package 'tools'") once GitHub's ubuntu-latest runner image moved its
      # bundled cmdline-tools forward — that action still calls `sdkmanager
      # tools`, a legacy package Google removed from the SDK repository long
      # ago. ubuntu-latest already ships a licensed Android SDK (ANDROID_HOME
      # preinstalled, per actions/runner-images) sufficient for AGP to pull
      # whatever compileSdk platform it needs on its own, so this step was
      # redundant on top of being broken — dropped instead of pinned/patched.

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew scripts/fetch-libxray.sh
        working-directory: android

      - name: Fetch libXray .aar
        working-directory: android
        run: ./scripts/fetch-libxray.sh

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug

  web:
    name: Build (Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build web client
        working-directory: web
        run: |
          npm ci
          npm run build

  desktop:
    name: Build (Desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Fetch xray-core binary
        working-directory: desktop
        run: npm run fetch:xray -- linux-x64

      - name: Typecheck
        working-directory: desktop
        run: npm run typecheck

      - name: Build (main/preload/renderer bundles)
        working-directory: desktop
        run: npm run build

      - name: Package unsigned Linux build (smoke test)
        # --publish never: this is a packaging smoke test, not a release —
        # without it, electron-builder detects the CI env var GitHub Actions
        # sets and tries to auto-resolve a publish config from .git/config,
        # which fails here since this repo has no "repository" field in
        # package.json and the checkout doesn't need one for this step.
        working-directory: desktop
        run: npx electron-builder --linux --dir --publish never

  publish:
    name: Build Jar & Publish Docker Image
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install web dependencies (bundled into the server jar by buildWebDist)
        working-directory: web
        run: npm ci

      - name: Build BootJar
        run: ./gradlew :server:bootJar -x test

      - name: Publish to Docker Registry
        if: env.DOCKER_USER != ''
        env:
          DOCKER_USER: ${{ secrets.DOCKER_PUBLISH_REGISTRY_USERNAME }}
        uses: elgohr/Publish-Docker-Github-Action@master
        with:
          name: ${{ secrets.DOCKER_IMAGE_NAME || 'romanew/vpn-server:latest' }}
          username: ${{ secrets.DOCKER_PUBLISH_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_PUBLISH_REGISTRY_PASSWORD }}

  publish-node:
    name: Publish VPN Node/Agent Docker Image
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish to Docker Registry
        if: env.DOCKER_USER != ''
        env:
          DOCKER_USER: ${{ secrets.DOCKER_PUBLISH_REGISTRY_USERNAME }}
        uses: elgohr/Publish-Docker-Github-Action@master
        with:
          name: ${{ secrets.DOCKER_NODE_IMAGE_NAME || 'romanew/vpn-node:latest' }}
          username: ${{ secrets.DOCKER_PUBLISH_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_PUBLISH_REGISTRY_PASSWORD }}
          dockerfile: agent/Dockerfile

  deploy:
    name: Deploy to Server via SSH
    needs: publish
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.yml
        uses: appleboy/scp-action@master
        with:
          host: 217.216.79.46
          username: root
          port: 22
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yml
          target: ~/vpn/

      - name: Start using docker compose
        uses: appleboy/ssh-action@master
        with:
          host: 217.216.79.46
          username: root
          port: 22
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/vpn
            export DOCKER_IMAGE="${{ secrets.DOCKER_IMAGE_NAME || 'romanew/vpn-server:latest' }}"
            export POSTGRES_USER="${{ secrets.POSTGRES_USER }}"
            export POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"
            docker compose down
            docker compose pull
            docker compose up -d
