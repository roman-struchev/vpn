org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
android.nonTransitiveRClass=true
# Gradle 8.x cannot run on Java 25. If your default `java` is 25 (Java 26+ LTS
# machines), point JAVA_HOME at a JDK 17-21 before invoking ./gradlew, e.g.:
#   JAVA_HOME=$(/usr/libexec/java_home -v 21) ./gradlew build
# App bytecode itself still targets Java 17 (see app/build.gradle compileOptions).
