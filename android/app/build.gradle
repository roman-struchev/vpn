plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vpn.android'
    compileSdk 34

    defaultConfig {
        applicationId "com.vpn.android"
        minSdk 26
        targetSdk 34
        // Defaults below are for local/dev builds only. Release builds (see
        // .github/workflows/release.yml) override both from the root
        // VERSION file via -PversionName=... -PversionCode=..., so that
        // file stays the single source of truth and these two never drift
        // from the Docker image tags / DMG version cut from the same release.
        versionCode (project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 1)
        versionName (project.findProperty('versionName') ?: '0.1.0-mvp')

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Placeholder backend host; override per-environment with
        // -PapiBaseUrl=https://... or a release-specific gradle.properties.
        buildConfigField "String", "API_BASE_URL", "\"${project.findProperty('apiBaseUrl') ?: 'https://vpn.struchev.site/'}\""
        // Phase 10: comma-separated backup domains tried in order if the
        // primary is unreachable (see ApiHostRotation). Empty by default.
        buildConfigField "String", "API_BASE_URLS_BACKUP", "\"${project.findProperty('apiBaseUrlsBackup') ?: ''}\""
        // Public origin of the web dashboard — only used as a local fallback when
        // building the shareable referral link (`<site>/?ref=CODE`); normally the
        // server hands the finished link back in GET /api/v1/user/profile.
        buildConfigField "String", "WEB_BASE_URL", "\"${project.findProperty('webBaseUrl') ?: 'https://nextgenvpn.app/'}\""

        // libXray bundles a Go runtime per ABI (~20-25MB each); drop legacy 32-bit x86.
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        release {
            // No production signing certificate/secrets exist anywhere in this
            // repo. Signing with the SDK's auto-generated local debug keystore
            // keeps the release APK installable (`adb install`) for internal
            // testing/CI artifacts; it is NOT a Play Store-ready signed build.
            // Swap this for a real signingConfig if/when a production keystore
            // and secrets are provisioned.
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    // Prebuilt XTLS/libXray .aar, fetched by scripts/fetch-libxray.sh (not committed to git).
    implementation files('libs/libXray.aar')

    testImplementation 'junit:junit:4.13.2'

    // Real-device/emulator instrumented tests (src/androidTest) — see
    // ApiFlowTest for why these exist alongside the pure-JVM testImplementation
    // ones above: those never touch a real Android Context (TokenStore's
    // Keystore-backed EncryptedSharedPreferences) or a real network stack.
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    // Espresso drives real taps/typing against the app's actual rendered
    // Activities/Fragments (see UiFlowTest) — as opposed to ApiFlowTest,
    // which never opens a UI at all.
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    // UiAutomator can reach OUTSIDE the app's own view hierarchy, which
    // Espresso cannot: used only to click through the one-time, OS-owned
    // VpnService consent dialog in UiFlowTest's connect-flow stretch goal.
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
