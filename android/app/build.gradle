plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vpn.android'
    compileSdk 34

    defaultConfig {
        applicationId "com.vpn.android"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0-mvp"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Placeholder backend host; override per-environment with
        // -PapiBaseUrl=https://... or a release-specific gradle.properties.
        buildConfigField "String", "API_BASE_URL", "\"${project.findProperty('apiBaseUrl') ?: 'https://api.nextgenvpn.app/'}\""

        // libXray bundles a Go runtime per ABI (~20-25MB each); drop legacy 32-bit x86.
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    // Prebuilt XTLS/libXray .aar, fetched by scripts/fetch-libxray.sh (not committed to git).
    implementation files('libs/libXray.aar')

    testImplementation 'junit:junit:4.13.2'
}
