plugins {
    id 'com.android.application'
    id 'com.google.protobuf'
}

android {
    namespace 'com.vpn.android'
    compileSdk 34

    defaultConfig {
        applicationId "com.vpn.android"
        minSdk 26
        targetSdk 34
        // Defaults below are for local/dev builds only. Release builds (see
        // .github/workflows/release.yml) override both from the root
        // VERSION file via -PversionName=... -PversionCode=..., so that
        // file stays the single source of truth and these two never drift
        // from the Docker image tags / DMG version cut from the same release.
        versionCode (project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 1)
        versionName (project.findProperty('versionName') ?: '0.1.0-mvp')

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Placeholder backend host; override per-environment with
        // -PapiBaseUrl=https://... or a release-specific gradle.properties.
        // Temporarily pointed at the test server (217.216.79.46:8080) instead
        // of the vpn.struchev.site production domain — switch back once that's live again.
        buildConfigField "String", "API_BASE_URL", "\"${project.findProperty('apiBaseUrl') ?: 'http://217.216.79.46:8080/'}\""
        // Phase 10: comma-separated backup domains tried in order if the
        // primary is unreachable (see ApiHostRotation). Empty by default.
        buildConfigField "String", "API_BASE_URLS_BACKUP", "\"${project.findProperty('apiBaseUrlsBackup') ?: ''}\""
        // Public origin of the web dashboard: opened directly for the P2P terms
        // page, and used as a local fallback when building the shareable referral
        // link (`<site>/?ref=CODE`) if the server hasn't already handed one back
        // in GET /api/v1/user/profile. Temporarily pointed at the test server
        // (217.216.79.46:8080 — the web dashboard is bundled into and served by
        // the same server jar, see server/build.gradle's buildWebDist) instead of
        // the vpn.struchev.site production domain — switch back once that's live
        // again (matches server/src/main/resources/application.yml's
        // vpn.public.web-base-url default).
        buildConfigField "String", "WEB_BASE_URL", "\"${project.findProperty('webBaseUrl') ?: 'http://217.216.79.46:8080/'}\""
        // In-app updater (AppUpdateChecker): owner/repo whose GitHub Releases
        // are polled for a newer build. Matches .github/workflows/release.yml,
        // which tags `v<version>` releases here with a `vpn-android-<version>.apk`
        // asset attached — see that workflow's android-apk job.
        buildConfigField "String", "GITHUB_REPO", "\"${project.findProperty('githubRepo') ?: 'roman-struchev/vpn'}\""

        // P2P relay (docs/research/P2P_RELAY_FEASIBILITY.md §8): the gRPC
        // control-plane host:port a p2p-mode device registers/streams
        // against as a node — separate from API_BASE_URL/HTTPS above since
        // this is the same plaintext gRPC port (server/application.yml's
        // grpc.server.port) every VPS node agent already dials. Same
        // temporary test-server override as API_BASE_URL until DNS is live.
        buildConfigField "String", "P2P_GRPC_ADDRESS", "\"${project.findProperty('p2pGrpcAddress') ?: '217.216.79.46:9090'}\""

        // libXray bundles a Go runtime per ABI (~20-25MB each); drop legacy 32-bit x86.
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }

    // Release signing identity, supplied out-of-band (never committed): a
    // keystore path + credentials via -PreleaseKeystore=... or the
    // ANDROID_KEYSTORE_FILE/_PASSWORD/_ALIAS/ANDROID_KEY_PASSWORD env vars
    // that .github/workflows/release.yml sets from repo secrets.
    //
    // This MUST be a stable key. Android refuses to install an update whose
    // signature differs from the installed app ("App not installed as package
    // conflicts with an existing package"), and the debug keystore this used
    // to fall back to is not stable: the SDK auto-generates
    // ~/.android/debug.keystore per machine and nothing caches it on a CI
    // runner, so every release was signed with a fresh random key and could
    // never update the one before it (v0.1.11 and v0.1.12 shipped with two
    // different certificates). android/scripts/verify-apk-signature.sh pins
    // the expected certificate so that regression fails the build instead of
    // reaching a phone.
    // .trim(): these routinely arrive from a CI secret or a `... < file`
    // redirect that carries a trailing newline, and a password with a stray
    // "\n" fails signing with nothing but "keystore password was incorrect".
    // No credential here legitimately begins or ends with whitespace.
    def trimmed = { value -> value?.toString()?.trim() ?: null }
    def releaseKeystorePath = trimmed(project.findProperty('releaseKeystore') ?: System.getenv('ANDROID_KEYSTORE_FILE'))
    def releaseKeystorePassword = trimmed(project.findProperty('releaseKeystorePassword') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD'))
    def releaseKeyAlias = trimmed(project.findProperty('releaseKeyAlias') ?: System.getenv('ANDROID_KEY_ALIAS')) ?: 'vpn'
    def releaseKeyPassword = trimmed(project.findProperty('releaseKeyPassword') ?: System.getenv('ANDROID_KEY_PASSWORD')) ?: releaseKeystorePassword
    def hasReleaseKeystore = releaseKeystorePath && file(releaseKeystorePath).exists()

    signingConfigs {
        if (hasReleaseKeystore) {
            create('release') {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.getByName('release')
            } else {
                // Local convenience only: an unconfigured dev machine still
                // gets an installable APK (`adb install`), but one that cannot
                // update a released build and must never be published. The
                // release workflow hard-fails instead of taking this branch.
                logger.warn('WARNING: no release keystore configured (-PreleaseKeystore=... or ANDROID_KEYSTORE_FILE) — '
                        + 'signing with the local debug key. This APK cannot update a published release.')
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        abortOnError false
    }

    testOptions {
        unitTests {
            // android.jar in a JVM unit test is a stub whose every method throws
            // "not mocked" by default. That turns an ordinary Log.w on a failure
            // path into an exception that skips whatever came after it — which is
            // exactly what hid a session-teardown bug here (P2pRelayConnectorTest):
            // the code was right, the log line swallowed it. Returning defaults
            // makes logging inert in tests instead of hostile.
            returnDefaultValues = true
        }
    }

    // Android modules configure source dirs under `android.sourceSets`, not a
    // top-level `sourceSets {}` (that's the plain-Java-project DSL and
    // collides with the Android plugin's own configuration of that name).
    sourceSets {
        main {
            proto {
                srcDir '../../proto'
            }
        }
    }
}

// Must match server/build.gradle's protobufVersion/grpcCodegenVersion exactly
// (docs §8) — these two projects decode the same wire messages, and a codegen
// skew across grpc-java versions is exactly the failure mode that comment
// over there warns about.
def protobufVersion = '4.29.3'
def grpcVersion = '1.83.1'

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        // "lite" runtime/codegen: the full protobuf-java + grpc-java runtime
        // pulls in a lot of reflection-based machinery this app has no use
        // for and that bloats the APK; javalite is the standard choice for
        // Android gRPC clients (see grpc-java's own android examples).
        all().configureEach { task ->
            task.builtins {
                java { option 'lite' }
            }
            task.plugins {
                grpc { option 'lite' }
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // Chrome Custom Tabs, used by WebHandoffLauncher to open the web dashboard
    // in the system browser (with its saved cookies/sessions) rather than an
    // embedded WebView — see WEB_HANDOFF_RESEARCH.md §2.6/§3.4.
    implementation 'androidx.browser:browser:1.8.0'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    // Google Sign-In via the modern Credential Manager API (not the deprecated
    // GoogleSignInClient/GoogleApiClient) — see LoginActivity#signInWithGoogle.
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    // Prebuilt XTLS/libXray .aar, fetched by scripts/fetch-libxray.sh (not committed to git).
    implementation files('libs/libXray.aar')

    // P2P relay (docs §8): node-role gRPC client (registration + the
    // AgentStream bidi stream), javalite runtime to match the codegen config
    // above.
    implementation "io.grpc:grpc-okhttp:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf-lite:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "com.google.protobuf:protobuf-javalite:${protobufVersion}"
    // javax.annotation.Generated, referenced by protoc-gen-grpc-java's output
    // on JDK/Android toolchains where that annotation isn't already on the
    // bootclasspath — a well-known grpc-java-on-Android compile gotcha.
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'

    // Actively-maintained fork of Google's original org.webrtc AAR, which was
    // pulled from Maven years ago — this is the de facto standard drop-in
    // replacement for WebRTC on Android now (docs §8.1: DataChannel + STUN,
    // no TURN fallback).
    implementation 'io.getstream:stream-webrtc-android:1.3.8'

    testImplementation 'junit:junit:4.13.2'

    // Real-device/emulator instrumented tests (src/androidTest) — see
    // ApiFlowTest for why these exist alongside the pure-JVM testImplementation
    // ones above: those never touch a real Android Context (TokenStore's
    // Keystore-backed EncryptedSharedPreferences) or a real network stack.
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    // Espresso drives real taps/typing against the app's actual rendered
    // Activities/Fragments (see UiFlowTest) — as opposed to ApiFlowTest,
    // which never opens a UI at all.
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    // UiAutomator can reach OUTSIDE the app's own view hierarchy, which
    // Espresso cannot: used only to click through the one-time, OS-owned
    // VpnService consent dialog in UiFlowTest's connect-flow stretch goal.
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
