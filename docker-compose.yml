services:
  postgres:
    image: postgres:17-alpine
    container_name: vpn-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vpn_db}
      POSTGRES_USER: ${POSTGRES_USER:-vpn_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vpn_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vpn_user} -d ${POSTGRES_DB:-vpn_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: .
    image: ${DOCKER_IMAGE:-vpn-server:latest}
    container_name: vpn-server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
      - "${GRPC_PORT:-9090}:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vpn_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-vpn_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-vpn_secret}
      SERVER_PORT: 8080
      GRPC_SERVER_PORT: 9090
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0

volumes:
  pgdata:
