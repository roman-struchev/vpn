server:
  port: 8080

spring:
  application:
    name: vpn-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vpn_db}
    username: ${SPRING_DATASOURCE_USERNAME:vpn_user}
    password: ${SPRING_DATASOURCE_PASSWORD:vpn_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9090}

security:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-hours: 720 # 30 days

vpn:
  # Public origin of the web dashboard. Used to build the shareable referral link
  # (`<web-base-url>/?ref=CODE`) handed to every client in GET /api/v1/user/profile —
  # a plain https link works for any invitee, unlike a Telegram-only deep link.
  public:
    web-base-url: ${VPN_PUBLIC_WEB_BASE_URL:https://nextgenvpn.app}
  reality:
    dest: ${VPN_REALITY_DEST:dl.google.com:443}
    server-names: ${VPN_REALITY_SNI:dl.google.com,gateway.icloud.com}
  heartbeat-interval-sec: 30
  stats-interval-sec: 30
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    bot-username: ${TELEGRAM_BOT_USERNAME:MyVpnBot}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    mini-app-url: ${TELEGRAM_MINI_APP_URL:https://vpn.example.com}
  # Phase 9: gRPC+Reality fallback inbound, offered alongside XHTTP on every
  # "direct" node (see NodeManagementService#buildNodeConfigSync).
  grpc-fallback:
    port: ${VPN_GRPC_FALLBACK_PORT:8443}
    service-name: ${VPN_GRPC_FALLBACK_SERVICE_NAME:vless-grpc}
  # Phase 9: cert directory convention for CDN-type nodes (real TLS, no
  # Reality) — see scripts/install-node.sh's optional certbot step.
  cdn:
    cert-dir: ${VPN_CDN_CERT_DIR:/etc/xray/certs}
  # Phase 10: anti-enumeration — rotate a user's VLESS keys after their
  # subscription/export endpoint is pulled from more than max-distinct-ips
  # distinct IPs within window-minutes (see AntiEnumerationService).
  anti-enum:
    window-minutes: ${VPN_ANTI_ENUM_WINDOW_MINUTES:60}
    max-distinct-ips: ${VPN_ANTI_ENUM_MAX_DISTINCT_IPS:5}
  crypto:
    tron-deposit-address: ${VPN_TRON_DEPOSIT_ADDRESS:TXxxDefaultDepositAddressTRC20}
    # Ethereum/Base/Arbitrum/Polygon all use the same 0x address for a given key
    # (docs/PLAN.md §7) — one address covers whichever EVM chain vpn.blockchain.evm
    # below is pointed at.
    evm-deposit-address: ${VPN_EVM_DEPOSIT_ADDRESS:}
  blockchain:
    scanner:
      enabled: ${VPN_BLOCKCHAIN_SCANNER_ENABLED:false}
    trongrid-url: ${VPN_TRONGRID_URL:https://api.trongrid.io}
    trongrid-api-key: ${VPN_TRONGRID_API_KEY:}
    usdt-contract: ${VPN_TRON_USDT_CONTRACT:TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t}
    # ERC-20 watcher (docs/PLAN.md §7: "EvmChainWatcher(rpcUrl, chainId, token,
    # decimals, confirmations)... Base/Arbitrum/Polygon включаются конфигом без
    # нового кода" — point rpc-url/chain-id/usdt-contract at whichever EVM chain
    # is live; chain-name must match the "chain" value used when creating invoices
    # (UserController POST /api/v1/user/billing/invoice, default "TRON").
    evm:
      enabled: ${VPN_EVM_SCANNER_ENABLED:false}
      chain-name: ${VPN_EVM_CHAIN_NAME:ETHEREUM}
      rpc-url: ${VPN_EVM_RPC_URL:}
      chain-id: ${VPN_EVM_CHAIN_ID:1}
      usdt-contract: ${VPN_EVM_USDT_CONTRACT:0xdAC17F958D2ee523a2206206994597C13D831ec7}
      usdt-decimals: ${VPN_EVM_USDT_DECIMALS:6}
      confirmations: ${VPN_EVM_CONFIRMATIONS:12}
