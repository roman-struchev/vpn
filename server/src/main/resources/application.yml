server:
  port: 8080

spring:
  application:
    name: vpn-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vpn_db}
    username: ${SPRING_DATASOURCE_USERNAME:vpn_user}
    password: ${SPRING_DATASOURCE_PASSWORD:vpn_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9090}

security:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-hours: 720 # 30 days

vpn:
  reality:
    dest: ${VPN_REALITY_DEST:dl.google.com:443}
    server-names: ${VPN_REALITY_SNI:dl.google.com,gateway.icloud.com}
  heartbeat-interval-sec: 30
  stats-interval-sec: 30
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
