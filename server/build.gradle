plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.protobuf' version '0.9.4'
}

group = 'com.vpn'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

def protobufVersion = '4.29.3'
// Only for the protoc-gen-grpc-java codegen plugin below — protobuf-gradle-plugin
// resolves that as a standalone binary artifact, outside io.spring.dependency-management's
// reach, so it can't inherit Spring Boot's BOM-managed io.grpc version the way the
// runtime io.grpc:* dependencies do. Must match grpc-java.version in
// spring-boot-dependencies (currently 1.83.1) or generated stubs can skew from the
// runtime grpc-core/grpc-netty-shaded versions again.
def grpcCodegenVersion = '1.83.1'

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Database & Flyway.
    // Spring Boot 4.x moved Flyway's Spring autoconfiguration out of the
    // monolithic spring-boot-autoconfigure jar into this dedicated starter
    // (mirrors what happened to Hibernate's JPA autoconfiguration — see
    // HibernateJpaConfiguration now living in org.springframework.boot.hibernate.autoconfigure).
    // Depending on org.flywaydb:flyway-core directly (as this project did
    // before) pulls in Flyway itself but NOT that autoconfiguration, so
    // migrations silently never ran — Hibernate's schema validation then
    // failed on every table against a fresh database. Confirmed by actually
    // booting against a real Postgres 17 container, not just the H2
    // ddl-auto=create-drop test profile which never exercises Flyway at all.
    implementation 'org.postgresql:postgresql:42.7.5'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // gRPC & Protobuf.
    // No explicit io.grpc version here: Spring Boot 4.1.1's BOM manages
    // io.grpc:grpc-bom (currently 1.83.1). Pinning grpc-netty-shaded to an
    // older version here while grpc-core/grpc-api/grpc-stub resolved to the
    // BOM's newer one caused a runtime AbstractMethodError on server startup
    // (ServerImplBuilder$ClientTransportServersBuilder — the netty transport
    // and the core server-building API were from different grpc releases).
    // Confirmed by booting the gRPC server against real infrastructure.
    implementation "io.grpc:grpc-netty-shaded"
    implementation "io.grpc:grpc-protobuf"
    implementation "io.grpc:grpc-stub"
    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
    compileOnly 'jakarta.annotation:jakarta.annotation-api:3.0.0'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Jackson / Java 8 time
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Test
    testImplementation 'com.h2database:h2:2.3.232'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.5'
    testImplementation 'org.testcontainers:postgresql:1.20.5'
}

sourceSets {
    main {
        proto {
            srcDir '../proto'
        }
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcCodegenVersion}"
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs(
        '-XX:+EnableDynamicAgentLoading',
        '-Dnet.bytebuddy.experimental=true',
        '--add-opens=java.base/java.lang=ALL-UNNAMED',
        '--add-opens=java.base/java.util=ALL-UNNAMED'
    )
}

tasks.register('copyWebDist', Copy) {
    from file('../web/dist')
    into file('src/main/resources/static')
    onlyIf { file('../web/dist').exists() }
}

processResources.dependsOn copyWebDist

