plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.protobuf' version '0.9.4'
}

group = 'com.vpn'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

def protobufVersion = '4.29.3'
// Only for the protoc-gen-grpc-java codegen plugin below — protobuf-gradle-plugin
// resolves that as a standalone binary artifact, outside io.spring.dependency-management's
// reach, so it can't inherit Spring Boot's BOM-managed io.grpc version the way the
// runtime io.grpc:* dependencies do. Must match grpc-java.version in
// spring-boot-dependencies (currently 1.83.1) or generated stubs can skew from the
// runtime grpc-core/grpc-netty-shaded versions again.
def grpcCodegenVersion = '1.83.1'

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Password-reset codes by email; only active when spring.mail.host is set (MailService).
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Database & Flyway.
    // Spring Boot 4.x moved Flyway's Spring autoconfiguration out of the
    // monolithic spring-boot-autoconfigure jar into this dedicated starter
    // (mirrors what happened to Hibernate's JPA autoconfiguration — see
    // HibernateJpaConfiguration now living in org.springframework.boot.hibernate.autoconfigure).
    // Depending on org.flywaydb:flyway-core directly (as this project did
    // before) pulls in Flyway itself but NOT that autoconfiguration, so
    // migrations silently never ran — Hibernate's schema validation then
    // failed on every table against a fresh database. Confirmed by actually
    // booting against a real Postgres 17 container, not just the H2
    // ddl-auto=create-drop test profile which never exercises Flyway at all.
    implementation 'org.postgresql:postgresql:42.7.5'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // gRPC & Protobuf.
    // No explicit io.grpc version here: Spring Boot 4.1.1's BOM manages
    // io.grpc:grpc-bom (currently 1.83.1). Pinning grpc-netty-shaded to an
    // older version here while grpc-core/grpc-api/grpc-stub resolved to the
    // BOM's newer one caused a runtime AbstractMethodError on server startup
    // (ServerImplBuilder$ClientTransportServersBuilder — the netty transport
    // and the core server-building API were from different grpc releases).
    // Confirmed by booting the gRPC server against real infrastructure.
    implementation "io.grpc:grpc-netty-shaded"
    implementation "io.grpc:grpc-protobuf"
    implementation "io.grpc:grpc-stub"
    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
    compileOnly 'jakarta.annotation:jakarta.annotation-api:3.0.0'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Jackson / Java 8 time
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Test
    testImplementation 'com.h2database:h2:2.3.232'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.5'
    testImplementation 'org.testcontainers:postgresql:1.20.5'
}

sourceSets {
    main {
        proto {
            srcDir '../proto'
        }
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcCodegenVersion}"
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs(
        '-XX:+EnableDynamicAgentLoading',
        '-Dnet.bytebuddy.experimental=true',
        '--add-opens=java.base/java.lang=ALL-UNNAMED',
        '--add-opens=java.base/java.util=ALL-UNNAMED',
        // H2 (the test datasource, application-test.yml) round-trips a
        // java.time.Instant through the JVM's default timezone rather than
        // UTC when Hibernate's ddl-auto generates its own TIMESTAMP columns
        // (real Postgres's TIMESTAMPTZ has no such ambiguity, so production
        // is unaffected) -- shifting a FUTURE instant by the local UTC
        // offset on the way back out of the DB. Every pre-existing test
        // here only ever checked PAST timestamps (already-expired
        // subscriptions, etc.), where a stray offset never mattered -- a
        // future bootstrap-token expiry (P2pNodeLifecycleIntegrationTest)
        // was the first to actually notice, immediately reporting a
        // brand-new 1h-valid token as already expired. Setting
        // spring.jpa.properties.hibernate.jdbc.time_zone alone did not fix
        // this (Spring's context-caching across test classes in one JVM
        // fork can initialize Hibernate's timezone handling before that
        // property is read); forcing the JVM's own default timezone here
        // fixes it unconditionally, before any Spring context exists.
        '-Duser.timezone=UTC'
    )
}

// copyWebDist only ever copied web/dist as-is — it never rebuilt it, so
// `bootRun`/`processResources` silently bundled whatever static JS/CSS
// happened to be sitting in web/dist from whenever someone last ran
// `npm run build` in web/ by hand (confirmed live: a server started via
// bootRun served a UI build from hours earlier, missing several since-
// landed frontend changes). buildWebDist actually runs the web build first;
// declared inputs/outputs let Gradle skip it when web/src genuinely hasn't
// changed, rather than rebuilding on every single bootRun.
tasks.register('buildWebDist', Exec) {
    workingDir file('../web')
    commandLine 'npm', 'run', 'build'
    inputs.dir file('../web/src')
    inputs.files file('../web/package.json'), file('../web/index.html'),
            file('../web/vite.config.ts'), file('../web/tailwind.config.js'),
            file('../web/tsconfig.json')
    outputs.dir file('../web/dist')
    onlyIf { file('../web/package.json').exists() }
}

tasks.register('copyWebDist', Copy) {
    dependsOn buildWebDist
    from file('../web/dist')
    into file('src/main/resources/static')
    onlyIf { file('../web/dist').exists() }
}

processResources.dependsOn copyWebDist

